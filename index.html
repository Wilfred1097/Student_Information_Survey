<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Student Information Survey</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- SweetAlert2 CSS & JS -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <!-- Google Fonts Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #311042 100%);
            min-height: 100vh;
        }
        .glass-card {
            background: rgba(30, 41, 59, 0.75);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .glass-input {
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.12);
        }
        .glass-input:focus {
            background: rgba(15, 23, 42, 0.9);
            border-color: rgba(129, 140, 248, 0.6);
            box-shadow: 0 0 0 3px rgba(129, 140, 248, 0.2);
        }
        .glass-input:disabled {
            background: rgba(15, 23, 42, 0.3);
            cursor: not-allowed;
            opacity: 0.6;
        }
        select option {
            background-color: #0f172a;
            color: #f8fafc;
        }
    </style>
</head>
<body class="h-full text-slate-100 flex flex-col justify-between py-10 px-4 sm:px-6 lg:px-8">

    <header class="max-w-3xl mx-auto w-full text-center mb-8">
        <div class="inline-flex items-center justify-center w-14 h-14 rounded-2xl bg-gradient-to-tr from-indigo-500 to-purple-500 shadow-lg shadow-indigo-500/30 mb-4">
            <i class="fa-solid fa-graduation-cap text-white text-2xl"></i>
        </div>
        <h1 class="text-3xl font-bold tracking-tight text-white mb-2">Student Information Survey</h1>
        <p class="text-sm text-slate-400 max-w-md mx-auto">Please complete the registration form below with your accurate academic and residential details.</p>
    </header>

    <main class="max-w-3xl mx-auto w-full mb-auto">
        <div class="glass-card rounded-3xl p-6 sm:p-10 shadow-2xl">
            <form id="studentSurveyForm" class="space-y-8" novalidate>
                
                <!-- Section 1: Personal & Academic Info -->
                <fieldset class="space-y-4">
                    <div class="flex items-center space-x-3 pb-2 border-b border-slate-700/60">
                        <div class="w-8 h-8 rounded-lg bg-indigo-500/20 text-indigo-400 flex items-center justify-center font-semibold text-sm">
                            <i class="fa-solid fa-user-graduate"></i>
                        </div>
                        <legend class="text-base font-semibold text-indigo-300">Personal & Academic Info</legend>
                    </div>
                    
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 pt-2">
                        <div class="space-y-1.5">
                            <label for="fullName" class="block text-xs font-semibold uppercase tracking-wider text-slate-400">Full Name</label>
                            <div class="relative">
                                <span class="absolute inset-y-0 left-0 flex items-center pl-3.5 text-slate-400 pointer-events-none">
                                    <i class="fa-solid fa-user text-xs"></i>
                                </span>
                                <input type="text" id="fullName" required class="glass-input w-full rounded-xl pl-10 pr-4 py-3 text-sm text-slate-100 placeholder-slate-500 focus:outline-none transition-all" placeholder="e.g., Juan Dela Cruz" />
                            </div>
                        </div>

                        <div class="space-y-1.5">
                            <label for="gender" class="block text-xs font-semibold uppercase tracking-wider text-slate-400">Gender</label>
                            <div class="relative">
                                <span class="absolute inset-y-0 left-0 flex items-center pl-3.5 text-slate-400 pointer-events-none">
                                    <i class="fa-solid fa-venus-mars text-xs"></i>
                                </span>
                                <select id="gender" required class="glass-input w-full rounded-xl pl-10 pr-4 py-3 text-sm text-slate-100 focus:outline-none transition-all appearance-none cursor-pointer">
                                    <option value="" disabled selected>Select Gender</option>
                                    <option value="Male">Male</option>
                                    <option value="Female">Female</option>
                                    <option value="Prefer not to say">Prefer not to say</option>
                                </select>
                                <span class="absolute inset-y-0 right-0 flex items-center pr-4 text-slate-400 pointer-events-none">
                                    <i class="fa-solid fa-chevron-down text-xs"></i>
                                </span>
                            </div>
                        </div>
                    </div>

                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                        <div class="space-y-1.5">
                            <label for="course" class="block text-xs font-semibold uppercase tracking-wider text-slate-400">Course / Degree Program</label>
                            <div class="relative">
                                <span class="absolute inset-y-0 left-0 flex items-center pl-3.5 text-slate-400 pointer-events-none">
                                    <i class="fa-solid fa-book-open text-xs"></i>
                                </span>
                                <input type="text" id="course" required class="glass-input w-full rounded-xl pl-10 pr-4 py-3 text-sm text-slate-100 placeholder-slate-500 focus:outline-none transition-all" placeholder="e.g., BS Information Technology" />
                            </div>
                        </div>

                        <div class="space-y-1.5">
                            <label for="yearLevel" class="block text-xs font-semibold uppercase tracking-wider text-slate-400">Year Level</label>
                            <div class="relative">
                                <span class="absolute inset-y-0 left-0 flex items-center pl-3.5 text-slate-400 pointer-events-none">
                                    <i class="fa-solid fa-layer-group text-xs"></i>
                                </span>
                                <select id="yearLevel" required class="glass-input w-full rounded-xl pl-10 pr-4 py-3 text-sm text-slate-100 focus:outline-none transition-all appearance-none cursor-pointer">
                                    <option value="" disabled selected>Select Year Level</option>
                                    <option value="1st Year">1st Year</option>
                                    <option value="2nd Year">2nd Year</option>
                                    <option value="3rd Year">3rd Year</option>
                                    <option value="4th Year">4th Year</option>
                                    <option value="5th Year">5th Year+</option>
                                </select>
                                <span class="absolute inset-y-0 right-0 flex items-center pr-4 text-slate-400 pointer-events-none">
                                    <i class="fa-solid fa-chevron-down text-xs"></i>
                                </span>
                            </div>
                        </div>
                    </div>
                </fieldset>

                <!-- Section 2: Address Details (PSGC Cascading) -->
                <fieldset class="space-y-4">
                    <div class="flex items-center space-x-3 pb-2 border-b border-slate-700/60">
                        <div class="w-8 h-8 rounded-lg bg-purple-500/20 text-purple-400 flex items-center justify-center font-semibold text-sm">
                            <i class="fa-solid fa-map-location-dot"></i>
                        </div>
                        <legend class="text-base font-semibold text-purple-300">Residential Address (PSGC)</legend>
                    </div>

                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 pt-2">
                        <div class="space-y-1.5">
                            <label for="region" class="block text-xs font-semibold uppercase tracking-wider text-slate-400">Region</label>
                            <div class="relative">
                                <span class="absolute inset-y-0 left-0 flex items-center pl-3.5 text-slate-400 pointer-events-none">
                                    <i class="fa-solid fa-map text-xs"></i>
                                </span>
                                <select id="region" required class="glass-input w-full rounded-xl pl-10 pr-10 py-3 text-sm text-slate-100 focus:outline-none transition-all appearance-none cursor-pointer">
                                    <option value="" disabled selected>Loading regions...</option>
                                </select>
                                <span class="absolute inset-y-0 right-0 flex items-center pr-4 text-slate-400 pointer-events-none">
                                    <i class="fa-solid fa-chevron-down text-xs"></i>
                                </span>
                            </div>
                        </div>

                        <div class="space-y-1.5">
                            <label for="province" class="block text-xs font-semibold uppercase tracking-wider text-slate-400">Province</label>
                            <div class="relative">
                                <span class="absolute inset-y-0 left-0 flex items-center pl-3.5 text-slate-400 pointer-events-none">
                                    <i class="fa-solid fa-compass text-xs"></i>
                                </span>
                                <select id="province" disabled required class="glass-input w-full rounded-xl pl-10 pr-10 py-3 text-sm text-slate-100 focus:outline-none transition-all appearance-none cursor-pointer">
                                    <option value="" disabled selected>Select Region first</option>
                                </select>
                                <span class="absolute inset-y-0 right-0 flex items-center pr-4 text-slate-400 pointer-events-none">
                                    <i class="fa-solid fa-chevron-down text-xs"></i>
                                </span>
                            </div>
                        </div>
                    </div>

                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                        <div class="space-y-1.5">
                            <label for="city" class="block text-xs font-semibold uppercase tracking-wider text-slate-400">City / Municipality</label>
                            <div class="relative">
                                <span class="absolute inset-y-0 left-0 flex items-center pl-3.5 text-slate-400 pointer-events-none">
                                    <i class="fa-solid fa-city text-xs"></i>
                                </span>
                                <select id="city" disabled required class="glass-input w-full rounded-xl pl-10 pr-10 py-3 text-sm text-slate-100 focus:outline-none transition-all appearance-none cursor-pointer">
                                    <option value="" disabled selected>Select Province first</option>
                                </select>
                                <span class="absolute inset-y-0 right-0 flex items-center pr-4 text-slate-400 pointer-events-none">
                                    <i class="fa-solid fa-chevron-down text-xs"></i>
                                </span>
                            </div>
                        </div>

                        <div class="space-y-1.5">
                            <label for="barangay" class="block text-xs font-semibold uppercase tracking-wider text-slate-400">Barangay</label>
                            <div class="relative">
                                <span class="absolute inset-y-0 left-0 flex items-center pl-3.5 text-slate-400 pointer-events-none">
                                    <i class="fa-solid fa-signs-post text-xs"></i>
                                </span>
                                <select id="barangay" disabled required class="glass-input w-full rounded-xl pl-10 pr-10 py-3 text-sm text-slate-100 focus:outline-none transition-all appearance-none cursor-pointer">
                                    <option value="" disabled selected>Select City first</option>
                                </select>
                                <span class="absolute inset-y-0 right-0 flex items-center pr-4 text-slate-400 pointer-events-none">
                                    <i class="fa-solid fa-chevron-down text-xs"></i>
                                </span>
                            </div>
                        </div>
                    </div>

                    <div class="space-y-1.5 pt-2">
                        <label for="street" class="block text-xs font-semibold uppercase tracking-wider text-slate-400">House No. / Street / Building <span class="text-slate-500 font-normal">(Optional)</span></label>
                        <div class="relative">
                            <span class="absolute inset-y-0 left-0 flex items-center pl-3.5 text-slate-400 pointer-events-none">
                                <i class="fa-solid fa-house text-xs"></i>
                            </span>
                            <input type="text" id="street" class="glass-input w-full rounded-xl pl-10 pr-4 py-3 text-sm text-slate-100 placeholder-slate-500 focus:outline-none transition-all" placeholder="e.g., Block 5 Lot 12 Sunshine St." />
                        </div>
                    </div>
                </fieldset>

                <!-- Submit Button -->
                <div class="pt-4">
                    <button type="submit" class="w-full py-4 rounded-2xl bg-gradient-to-r from-indigo-600 to-purple-600 hover:from-indigo-500 hover:to-purple-500 text-white font-semibold shadow-xl shadow-indigo-600/30 transition-all flex items-center justify-center space-x-2 cursor-pointer">
                        <i class="fa-solid fa-paper-plane"></i>
                        <span>Submit Registration Survey</span>
                    </button>
                </div>
            </form>
        </div>
    </main>

    <footer class="max-w-3xl mx-auto w-full text-center text-xs text-slate-500 mt-8 pt-4 border-t border-slate-800">
        <p>Student Information Survey System • Powered by PSGC Cloud API & Tailwind CSS</p>
    </footer>

    <script>
        const API_BASE = 'https://psgc.cloud/api';

        // DOM Elements
        const regionSelect = document.getElementById('region');
        const provinceSelect = document.getElementById('province');
        const citySelect = document.getElementById('city');
        const barangaySelect = document.getElementById('barangay');

        // Fetch Regions on Page Load
        document.addEventListener('DOMContentLoaded', fetchRegions);

        async function fetchRegions() {
            try {
                const response = await fetch(`${API_BASE}/regions`);
                const regions = await response.json();

                regions.sort((a, b) => a.name.localeCompare(b.name));
                populateDropdown(regionSelect, regions, 'Select Region');
            } catch (error) {
                console.error('Error fetching regions:', error);
                regionSelect.innerHTML = '<option value="" disabled selected>Failed to load regions</option>';
            }
        }

        // Region Changed -> Fetch Provinces (or handle NCR)
        regionSelect.addEventListener('change', async function() {
            const regionCode = this.value;

            resetDropdown(provinceSelect, 'Loading provinces...');
            resetDropdown(citySelect, 'Select Province first');
            resetDropdown(barangaySelect, 'Select City first');

            try {
                const response = await fetch(`${API_BASE}/regions/${regionCode}/provinces`);
                const provinces = await response.json();

                // Handle Metro Manila (NCR) which does not have provinces
                if (provinces.length === 0) {
                    provinceSelect.innerHTML = '<option value="NCR" selected>NCR (Not Applicable)</option>';
                    provinceSelect.disabled = true;
                    fetchCities(regionCode, true);
                } else {
                    provinces.sort((a, b) => a.name.localeCompare(b.name));
                    populateDropdown(provinceSelect, provinces, 'Select Province');
                }
            } catch (error) {
                console.error('Error fetching provinces:', error);
            }
        });

        // Province Changed -> Fetch Cities / Municipalities
        provinceSelect.addEventListener('change', function() {
            const provinceCode = this.value;
            resetDropdown(citySelect, 'Loading cities/municipalities...');
            resetDropdown(barangaySelect, 'Select City first');

            fetchCities(provinceCode, false);
        });

        async function fetchCities(parentCode, isRegion) {
            try {
                const endpoint = isRegion 
                    ? `${API_BASE}/regions/${parentCode}/cities-municipalities`
                    : `${API_BASE}/provinces/${parentCode}/cities-municipalities`;

                const response = await fetch(endpoint);
                const cities = await response.json();

                cities.sort((a, b) => a.name.localeCompare(b.name));
                populateDropdown(citySelect, cities, 'Select City / Municipality');
            } catch (error) {
                console.error('Error fetching cities:', error);
            }
        }

        // City Changed -> Fetch Barangays
        citySelect.addEventListener('change', async function() {
            const cityCode = this.value;
            resetDropdown(barangaySelect, 'Loading barangays...');

            try {
                const response = await fetch(`${API_BASE}/cities-municipalities/${cityCode}/barangays`);
                const barangays = await response.json();

                barangays.sort((a, b) => a.name.localeCompare(b.name));
                populateDropdown(barangaySelect, barangays, 'Select Barangay');
            } catch (error) {
                console.error('Error fetching barangays:', error);
            }
        });

        // Helper: Populate Dropdowns
        function populateDropdown(element, data, defaultText) {
            element.innerHTML = `<option value="" disabled selected>${defaultText}</option>`;
            data.forEach(item => {
                const option = document.createElement('option');
                option.value = item.code;
                option.textContent = item.name;
                element.appendChild(option);
            });
            element.disabled = false;
        }

        // Helper: Reset Dropdowns
        function resetDropdown(element, defaultText) {
            element.innerHTML = `<option value="" disabled selected>${defaultText}</option>`;
            element.disabled = true;
        }

        // Handle Form Submission with SweetAlert2
        document.getElementById('studentSurveyForm').addEventListener('submit', function(e) {
            e.preventDefault();

            const fullName = document.getElementById('fullName').value;
            const gender = document.getElementById('gender').value;
            const course = document.getElementById('course').value;
            const yearLevel = document.getElementById('yearLevel').value;
            const street = document.getElementById('street').value;

            if (!fullName || !gender || !course || !yearLevel || !regionSelect.value || !citySelect.value || !barangaySelect.value) {
                Swal.fire({
                    title: 'Incomplete Form',
                    text: 'Please fill out all required fields before submitting.',
                    icon: 'warning',
                    confirmButtonColor: '#4f46e5',
                    background: '#1e293b',
                    color: '#f8fafc'
                });
                return;
            }

            const formData = {
                fullName,
                gender,
                course,
                yearLevel,
                address: {
                    region: regionSelect.options[regionSelect.selectedIndex].text,
                    province: provinceSelect.options[provinceSelect.selectedIndex].text,
                    city: citySelect.options[citySelect.selectedIndex].text,
                    barangay: barangaySelect.options[barangaySelect.selectedIndex].text,
                    street: street
                }
            };

            const fullAddress = [
                formData.address.street,
                `Brgy. ${formData.address.barangay}`,
                formData.address.city,
                formData.address.province !== 'NCR (Not Applicable)' ? formData.address.province : null,
                formData.address.region
            ].filter(Boolean).join(', ');

            Swal.fire({
                title: 'Registration Successful!',
                icon: 'success',
                html: `
                    <div style="text-align: left; font-size: 0.95rem; line-height: 1.6; color: #cbd5e1; background: rgba(15, 23, 42, 0.5); padding: 16px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.1);">
                        <p style="margin-bottom: 8px;"><strong style="color: #fff;">Name:</strong> ${formData.fullName}</p>
                        <p style="margin-bottom: 8px;"><strong style="color: #fff;">Gender:</strong> ${formData.gender}</p>
                        <p style="margin-bottom: 8px;"><strong style="color: #fff;">Course & Year:</strong> ${formData.course} (${formData.yearLevel})</p>
                        <p><strong style="color: #fff;">Address:</strong> ${fullAddress}</p>
                    </div>
                `,
                confirmButtonText: 'Awesome!',
                confirmButtonColor: '#4f46e5',
                background: '#1e293b',
                color: '#f8fafc'
            }).then((result) => {
                if (result.isConfirmed) {
                    document.getElementById('studentSurveyForm').reset();
                    resetDropdown(provinceSelect, 'Select Region first');
                    resetDropdown(citySelect, 'Select Province first');
                    resetDropdown(barangaySelect, 'Select City first');
                }
            });
        });
    </script>
</body>
</html>
